<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Electricals | Premium Industrial Solutions</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* Base Reset Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background-color: #fafafa;
            width: 100%;
        }

        /* Luxury Header Section */
        header {
            background: #111111;
            color: #ffffff;
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            width: 100%;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #c5a880; /* Premium Gold Accent */
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #c5a880;
        }

        /* Hero Banner Section */
        .hero-banner {
            background: linear-gradient(rgba(17, 17, 17, 0.75), rgba(17, 17, 17, 0.85)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="1200" height="500" viewBox="0 0 1200 500"><rect width="100%" height="100%" fill="%231a1a1a"/><path d="M0 500 L300 250 L600 450 L900 200 L1200 500 Z" fill="%23262626"/><path d="M0 500 L400 300 L800 480 L1200 250 L1200 500 Z" fill="%23222222"/></svg>') no-repeat center center/cover;
            color: #ffffff;
            padding: 10rem 2rem;
            text-align: center;
            border-bottom: 4px solid #c5a880;
            width: 100%;
        }

        .hero-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 700;
            font-style: italic;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .hero-banner p {
            font-size: 1.15rem;
            max-width: 800px;
            margin: 0 auto 3rem auto;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.8;
            color: #e0e0e0;
        }

        .action-btn {
            display: inline-block;
            background: transparent;
            color: #ffffff;
            padding: 1rem 2.5rem;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            border: 1px solid #c5a880;
            transition: all 0.4s ease;
        }

        .action-btn:hover {
            background: #c5a880;
            color: #111111;
            box-shadow: 0 4px 20px rgba(197, 168, 128, 0.4);
        }

        /* Main Content Layout Container Container */
        .content-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 1.5rem;
            width: 100%;
        }

        section {
            margin-bottom: 7rem;
            width: 100%;
        }

        section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            text-align: center;
            margin-bottom: 3.5rem;
            color: #111111;
            position: relative;
            padding-bottom: 1.2rem;
        }

        section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            height: 2px;
            background-color: #c5a880;
        }

        /* Dynamic Product Flex / Grid Blocks */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            width: 100%;
        }

        .info-card {
            background: #ffffff;
            padding: 3rem 2rem;
            border: 1px solid #eeeeee;
            box-shadow: 0 5px 25px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.07);
            border-color: #c5a880;
        }

        .info-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            color: #111111;
        }

        .info-card p {
            font-size: 0.95rem;
            color: #555555;
            line-height: 1.7;
        }

        /* Gallery System Structure */
        .media-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .gallery-item-box {
            background: #ffffff;
            border: 1px solid #eaeaea;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .image-frame {
            width: 100%;
            height: 280px;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item-box:hover .image-frame img {
            transform: scale(1.06);
        }

        .image-caption {
            padding: 1.2rem;
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 1px;
            background: #ffffff;
            color: #111111;
            border-top: 1px solid #f5f5f5;
        }

        /* Description Body Styles */
        .text-block-body p {
            font-size: 1.05rem;
            color: #444444;
            margin-bottom: 1.5rem;
            line-height: 1.9;
        }

        /* Solid Dark Footer Layout Grid */
        footer {
            background: #111111;
            color: #ffffff;
            padding: 5rem 2rem 3rem 2rem;
            border-top: 4px solid #c5a880;
            width: 100%;
        }

        .footer-columns {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 3.5rem;
            border-bottom: 1px solid #252525;
            padding-bottom: 3.5rem;
            width: 100%;
        }

        .footer-column h4 {
            font-family: 'Playfair Display', serif;
            color: #c5a880;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .footer-column p {
            color: #cccccc;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .whatsapp-btn-link {
            display: inline-block;
            color: #25d366;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.45rem;
            margin-top: 0.5rem;
            transition: opacity 0.2s ease;
        }

        .whatsapp-btn-link:hover {
            opacity: 0.85;
        }

        .footer-address-text {
            color: #ffffff !important;
            font-size: 1.25rem !important;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 1rem !important;
        }

        .map-route-link {
            display: inline-block;
            color: #c5a880;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            border-bottom: 1px dashed #c5a880;
            padding-bottom: 2px;
            transition: all 0.2s ease;
        }

        .map-route-link:hover {
            color: #ffffff;
            border-color: #ffffff;
        }

        .footer-base {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            color: #666666;
            font-size: 0.85rem;
            width: 100%;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Screen Adaptation Layers */
        @media (max-width: 768px) {
            .hero-banner h1 { font-size: 2.8rem; }
            .nav-container { flex-direction: column; gap: 1.2rem; text-align: center; }
            nav ul { gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
            .footer-base { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">SK Electricals</div>
